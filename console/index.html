<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Console | 更新后台</title>
<meta name="robots" content="noindex,nofollow">
<style>
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; background:#f5f6f8; color:#5b6472; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; font-size:14px; }
  .box { text-align:center; }
  .hint { margin-top:10px; font-size:12.5px; color:#a3abb6; }
</style>
</head>
<body>
  <div class="box">
    <p>Opening the Team Console…</p>
    <p>正在打开负责人更新后台…</p>
    <p class="hint" id="hint"></p>
  </div>
  <script>
  /* Target is stored encoded so the console URL never appears in plain text in this public repo.
     Decoded value = admin console on the Wahda platform. */
  (function () {
    var enc = "aHR0cHM6Ly93YWhkYS1wcm9ncmVzcy5hcHAud29ya2J1ZGR5Lmhvc3QvYWRtaW4uaHRtbD9zaGFyZWNvZGU9RURVT1FNUU9BSw==";
    try {
      var url = atob(enc);
      if (url.indexOf("https://") === 0) { location.replace(url); return; }
    } catch (e) {}
    document.getElementById("hint").textContent =
      "Redirect failed — please use the direct link from the product team. / 跳转失败，请使用产品团队提供的原始链接。";
  })();
  </script>
</body>
</html>
